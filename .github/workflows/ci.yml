name: CI

on:
  push:
    branches: [master, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            run: |
              uv run ruff check .
              uv run ruff format --check . --line-length=120
              uv run ruff format --check tests --line-length=120
              uv run mypy src tests
          - name: Test
            run: uv run pytest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.15"
          enable-cache: true
      - run: uv sync --locked
      - run: ${{ matrix.run }}
